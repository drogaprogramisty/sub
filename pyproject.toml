[project]
name = "sub-cli"
version = "1.0.0"
description = "Burn subtitles into video files"
requires-python = ">=3.9"
dependencies = [
    "pysubs2>=1.6.0",
]

[project.scripts]
sub = "sub:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["sub.py"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
